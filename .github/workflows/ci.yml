name: CI

on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --only-binary=':all:' '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - run: test -f .agents/skills/engineering/tdd/SKILL.md

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --only-binary=':all:' '.[dev]' 'pip-audit==2.10.1'
      - run: python -m pip_audit --local

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: global-market-agent-observatory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
