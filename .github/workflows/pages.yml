name: Deploy observe-only dashboard

on:
  push:
    branches: [main]
    paths:
      - "app/web/**"
      - "scripts/build_static_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build observe-only site
        run: python scripts/build_static_site.py --output site
      - name: Verify browser bundle safety
        run: |
          test -f site/index.html
          ! grep -R -E "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ALPACA_API_SECRET|IBKR_ACCOUNT_ID" site
          grep -q "mode: 'static'" site/config.js
          grep -q "PUBLIC DATA / OBSERVE ONLY" site/demo-data.js
          ! grep -R -E "/api/orders|backend-actions.js" site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
