name: Materialize verified source

on:
  push:
    branches:
      - feat/cloud-observatory-v1
    paths:
      - ".github/bootstrap/source.part-*"
      - ".github/workflows/materialize-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/cloud-observatory-v1

      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/source.part-* > /tmp/source.tar.xz.b64
          echo "b9966f6c691caf282205eb72f32922ef9a18479aeb3a00a8246a443058f88bb2  /tmp/source.tar.xz.b64" | sha256sum -c -
          base64 --decode /tmp/source.tar.xz.b64 > /tmp/source.tar.xz
          echo "bb667071be46b924cc0919e272f4d5c4fd3ba0fc7ff497a2931e1a5af1195966  /tmp/source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/source.tar.xz
          rm -f .bootstrap
          rm -rf .github/bootstrap

      - name: Install pinned engineering skills
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agents/vendor/mattpocock-skills .agents/skills .gitmodules
          git submodule add https://github.com/mattpocock/skills.git .agents/vendor/mattpocock-skills
          git -C .agents/vendor/mattpocock-skills checkout 8b36d4fb2635b3c21998dcd8144439c9e5ba7302
          ln -s vendor/mattpocock-skills/skills .agents/skills
          test "$(git -C .agents/vendor/mattpocock-skills rev-parse HEAD)" = "8b36d4fb2635b3c21998dcd8144439c9e5ba7302"
          test -f .agents/skills/engineering/tdd/SKILL.md

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
          python -m pytest -q
          bash scripts/loop_verify.sh

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish verified cloud observatory source"
          git push origin HEAD:feat/cloud-observatory-v1
